rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no service actions.
  appropriate-polling:
    status: exempt
    comment: The integration makes no polling requests.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration has no service actions.
  docs-conditions:
    status: exempt
    comment: The integration has no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration has no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: |
      The integration does not poll. Request failures are surfaced to the
      user per request, and setup retries through ConfigEntryNotReady.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Service integration, no discovery.
  discovery:
    status: exempt
    comment: Service integration, no discovery.
  docs-data-update:
    status: exempt
    comment: The integration only fetches models during configuration.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service integration, no devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Service integration, no devices.
  entity-category:
    status: exempt
    comment: No entities with categories.
  entity-device-class:
    status: exempt
    comment: No entities with device classes.
  entity-disabled-by-default:
    status: exempt
    comment: No entities disabled by default.
  entity-translations:
    status: exempt
    comment: Entity names are the user-defined subentry titles.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Only conversation and AI task entities, no icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      Authentication issues trigger the reauth flow, usage limits are
      transient, and removed models are fixed by editing the agent options.
  stale-devices:
    status: exempt
    comment: Service integration, no devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
